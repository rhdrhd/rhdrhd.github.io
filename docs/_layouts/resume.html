<!DOCTYPE html>
<html>
  {% include head.html %}
  <body class="terminal-body">
    <div class="terminal-noise" aria-hidden="true"></div>
    <main class="terminal-shell" role="main">
      <div class="terminal-screen" id="terminal-output" aria-live="polite" aria-label="Interactive resume terminal"></div>
      <form class="terminal-prompt" id="terminal-form" autocomplete="off">
        <label class="prompt-label" for="command-input">
          <span id="prompt-prefix">visitor@{{ site.resume_name | slugify: 'pretty' }}:~$</span>
        </label>
        <input type="text" id="command-input" name="command" spellcheck="false" autofocus aria-label="Type a command and press enter" />
      </form>
      <p class="terminal-hint">Need a nudge? Type <kbd>help</kbd> to list the available commands.</p>
    </main>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const outputEl = document.getElementById('terminal-output');
        const form = document.getElementById('terminal-form');
        const inputEl = document.getElementById('command-input');
        const promptLabel = document.getElementById('prompt-prefix').textContent.trim();

        const profile = {
          name: {{ site.resume_name | jsonify }},
          tagline: {{ site.description | jsonify }},
          email: {{ site.resume_contact_email | jsonify }},
          phone: {{ site.resume_contact_telephone | jsonify }},
          about: {{ "I'm " | append: site.resume_name | append: ", a " | append: site.data.education[0].degree | append: " student at " | append: site.data.education[0].uni | append: " who enjoys crafting playful machine learning projects and thoughtful experiences." | jsonify }},
          experience: {{ site.data.experience | jsonify }},
          education: {{ site.data.education | jsonify }},
          projects: {{ site.data.projects | jsonify }},
          social: {
            github: {{ site.resume_social_links.resume_github_url | jsonify }},
            linkedin: {{ site.resume_social_links.resume_linkedin_url | jsonify }},
            instagram: {{ site.resume_social_links.resume_instagram_url | jsonify }}
          }
        };

        const history = [];
        let historyIndex = 0;

        const aliasMap = {
          'cls': 'clear'
        };

        const commands = {
          help: {
            description: 'List the available commands',
            run: () => {
              const rows = Object.keys(commands)
                .filter((key) => !commands[key].hidden)
                .map((command) => `<span class="command-name">${command}</span> — ${commands[command].description}`);
              printLines(rows);
            }
          },
          about: {
            description: 'A quick introduction',
            run: () => {
              printLines([
                `<div class="terminal-block"><div class="terminal-title">${profile.name}</div><div>${profile.about}</div></div>`
              ]);
            }
          },
          experience: {
            description: 'Recent professional experience',
            run: () => {
              if (!Array.isArray(profile.experience) || !profile.experience.length) {
                printLines(['No experience data available right now.']);
                return;
              }
              const rows = profile.experience.map((job) => `
                <div class="terminal-block">
                  <div class="terminal-title">${job.position}${job.company ? ` @ ${job.company}` : ''}</div>
                  <div class="terminal-meta">${job.duration || ''}</div>
                  <div>${job.summary || ''}</div>
                </div>`);
              printLines(rows);
            }
          },
          education: {
            description: 'Where I studied',
            run: () => {
              if (!Array.isArray(profile.education) || !profile.education.length) {
                printLines(['No education data available right now.']);
                return;
              }
              const rows = profile.education.map((school) => `
                <div class="terminal-block">
                  <div class="terminal-title">${school.degree} — ${school.uni}</div>
                  <div class="terminal-meta">${school.year || ''}</div>
                  <div>${school.summary || ''}</div>
                </div>`);
              printLines(rows);
            }
          },
          projects: {
            description: 'Highlighted work and experiments',
            run: () => {
              if (!Array.isArray(profile.projects) || !profile.projects.length) {
                printLines(['No project data available right now.']);
                return;
              }
              const rows = profile.projects.map((project) => `
                <div class="terminal-block">
                  <div class="terminal-title">${project.project}</div>
                  <div class="terminal-meta">${project.duration || ''}</div>
                  <div>${project.description || ''}</div>
                </div>`);
              printLines(rows);
            }
          },
          contact: {
            description: 'How to get in touch',
            run: () => {
              const socials = Object.entries(profile.social)
                .filter(([, value]) => value)
                .map(([key, value]) => `<a href="${value}" target="_blank" rel="noopener" class="terminal-link">${key}</a>`);
              const rows = [
                `<div class="terminal-block">
                  <div class="terminal-title">${profile.name}</div>
                  ${profile.email ? `<div>Email: <a href="mailto:${profile.email}" class="terminal-link">${profile.email}</a></div>` : ''}
                  ${profile.phone ? `<div>Phone: <a href="tel:${profile.phone}" class="terminal-link">${profile.phone}</a></div>` : ''}
                  ${socials.length ? `<div>Social: ${socials.join(' · ')}</div>` : ''}
                </div>`
              ];
              printLines(rows);
            }
          },
          history: {
            description: 'Show the commands you have run',
            run: () => {
              if (!history.length) {
                printLines(['You have not run any commands yet.']);
                return;
              }
              const rows = history.map((entry, index) => `<div class="terminal-block">${index + 1}. ${entry}</div>`);
              printLines(rows);
            }
          },
          clear: {
            description: 'Clear the screen',
            run: () => {
              outputEl.innerHTML = '';
            }
          },
          banner: {
            description: 'Reprint the welcome banner',
            run: () => {
              printBanner();
            },
            hidden: true
          }
        };

        function escapeHtml(value) {
          return value.replace(/[&<>"']/g, (char) => ({
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;'
          }[char] || char));
        }

        function printLines(lines) {
          lines.forEach((line) => {
            const row = document.createElement('div');
            row.className = 'terminal-line';
            row.innerHTML = line;
            outputEl.appendChild(row);
          });
          outputEl.scrollTop = outputEl.scrollHeight;
        }

        function printCommand(command) {
          const row = document.createElement('div');
          row.className = 'terminal-line is-command';
          row.innerHTML = `<span class="prompt-label">${promptLabel}</span> ${escapeHtml(command)}`;
          outputEl.appendChild(row);
          outputEl.scrollTop = outputEl.scrollHeight;
        }

        function printBanner() {
          const banner = [
            ' __        ___           _        __          __              ',
            ' \\ \\      / / |__   _ __ (_) ___   \\ \\        / /__  _ __ ___ ',
            "  \\ \\ /\\ / /| '_ \\ | '__|| |/ __|   \\ \\ /\\ / / _ \\| '__/ _ \\",
            '   \\ V  V / | |_) || |   | | (__     \\ V  V / (_) | | |  __/',
            '    \\_/\\_/  |_.__/ |_|   |_|\\___|     \\_/\\_/ \\___/|_|  \\___|'
          ];
          printLines(banner.map((line) => `<span class="ascii">${line}</span>`));
          printLines([
            `<div class="terminal-block">
              <div class="terminal-title">${profile.name}</div>
              <div>${profile.tagline}</div>
              <div>Type <kbd>help</kbd> to explore the commands.</div>
            </div>`
          ]);
        }

        function runCommand(command) {
          if (!command) {
            return;
          }

          printCommand(command);
          history.push(command);
          historyIndex = history.length;

          const normalized = command.trim().toLowerCase();
          const resolved = aliasMap[normalized] || normalized;

          if (commands[resolved]) {
            commands[resolved].run();
          } else {
            printLines([`Command not found: ${escapeHtml(command)}. Type <kbd>help</kbd> to see what you can do.`]);
          }
        }

        form.addEventListener('submit', (event) => {
          event.preventDefault();
          const command = inputEl.value.trim();
          if (!command) {
            return;
          }
          runCommand(command);
          inputEl.value = '';
        });

        inputEl.addEventListener('keydown', (event) => {
          if (!history.length) {
            return;
          }
          if (event.key === 'ArrowUp') {
            event.preventDefault();
            historyIndex = Math.max(0, historyIndex - 1);
            inputEl.value = history[historyIndex] || '';
          } else if (event.key === 'ArrowDown') {
            event.preventDefault();
            historyIndex = Math.min(history.length, historyIndex + 1);
            inputEl.value = historyIndex === history.length ? '' : history[historyIndex] || '';
          }
        });

        printBanner();
      });
    </script>
  </body>
</html>
