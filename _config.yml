locale: en-US
title: Zirui Wang
subtitle: Notes on building, learning, and work
name: Zirui Wang
description: >-
  Personal website sharing background, selected projects, and blog posts.
url: ""
baseurl: ""
repository: "rhdrhd/rhdrhd.github.io"

# Theme
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: dirt
search: true

# Build
markdown: kramdown
permalink: /blog/:title/
paginate: 6
paginate_path: /blog/page:num/
timezone: America/New_York
include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name: "Zirui Wang"
  avatar: "/assets/images/profile.jpg"
  bio: "Software builder focused on practical products."
  location: "United States"
  links:
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/zirui-wang-348a80225/"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rhdrhd"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/rhdrhd"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
